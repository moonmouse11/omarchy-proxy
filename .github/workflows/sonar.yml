name: SonarQube

on:
  # SonarQube Cloud's free plan analyses main and pull requests only.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  sonar:
    # The scan step is skipped until SONAR_TOKEN is set in the repository
    # secrets. Tests with coverage still run.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup uv + Python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.12.23"
        python-version: "3.14"
        activate-environment: true
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install dependencies
      run: uv sync --locked --extra dev --no-build

    - name: Run tests with coverage
      run: pytest --cov=src --cov-report=xml

    - name: Run SonarQube analysis
      if: env.SONAR_TOKEN != ''
      uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
      env:
        SONAR_HOST_URL: https://sonarcloud.io

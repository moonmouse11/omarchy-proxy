# SonarQube / SonarCloud project configuration.
# SONAR_TOKEN lives in the GitHub repository secrets.

sonar.projectKey=moonmouse11_omarchy-proxy
sonar.organization=moonmouse11

sonar.sources=src,install.sh,uninstall.sh,docker/Dockerfile,pyproject.toml,Makefile,.github,Widget.qml,Panel.qml,AppWindow.qml,Client.js,manifest.json
sonar.tests=tests
sonar.python.version=3.14

# coverage.xml is written by pytest-cov. Its <source> tag resolves the paths.
sonar.python.coverage.reportPaths=coverage.xml

sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8
